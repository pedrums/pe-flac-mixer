name: Gig
description: Digitalmixer-Setup mit durchnummerierten Kanälen

# Target loudness levels per group (in LUFS)
group_levels:
  vocals lead: -14.0
  vocals background: -23.0
  drums: -21.0
  bass: -21.0
  guitars: -23.0
  keys: -23.0
  other: -23.0

channels:
  CH01.flac:
    name: Kick
    group: drums
    type: mono
    pan: 0.0

  CH02.flac:
    name: Snare
    group: drums
    type: mono
    pan: 0.0

  CH03.flac:
    name: HiHat
    group: drums
    type: mono
    pan: 0.25

  CH04.flac:
    name: Bass
    group: bass
    type: mono
    pan: 0.0

  CH05.flac:
    name: Guitar
    group: guitars
    type: mono
    pan: -0.4

  CH06.flac:
    name: Lead Vocal
    group: vocals
    type: mono
    pan: 0.0
