site_name: pe-flac-mixer
site_url: https://pedrums.github.io/pe-flac-mixer/
theme:
  name: material
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home: index.md
  - Workflow: TODO/workflow.md
  - API Reference: api.md
